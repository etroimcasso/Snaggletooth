name: CI

# Triggers fire on ci/** only — not main, not pull_request. Finished work reaches
# main by squash-merge from a ci/<branch> that already ran this pipeline to green;
# re-running on the post-squash main rebuilds the same source for no new signal.
on:
  push:
    branches:
      - 'ci/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# The oracle vectors (SingleStepTests: the SPC700 set, and the larger 65816 set)
# are never committed. Each job clones them once into the runner's home and reuses
# them warm on later runs. SNAGGLETOOTH_REQUIRE_VECTORS and
# SNAGGLETOOTH_REQUIRE_65816_VECTORS turn an absent vector set into a hard failure,
# so a green run has provably executed the whole uncapped oracle rather than
# skipping it — the point of running on every architecture is to prove the
# interpreters produce identical results on each.

jobs:

  # ── Linux x64 (beefserve) ───────────────────────────────────────────────────
  linux-x64:
    name: Linux x64 (beefserve)
    runs-on: [self-hosted, Linux, X64, beefserve]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Stage SPC700 vectors
        run: |
          set -eo pipefail
          VECS="$HOME/snaggletooth-spc700-vectors"
          if [ ! -d "$VECS/v1" ]; then
            rm -rf "$VECS"
            git clone --depth 1 https://github.com/SingleStepTests/spc700.git "$VECS"
          fi
          echo "SPC700_VECTORS=$VECS/v1" >> "$GITHUB_ENV"

      - name: Stage 65816 vectors
        run: |
          set -eo pipefail
          VECS="$HOME/snaggletooth-65816-vectors"
          if [ ! -d "$VECS/v1" ]; then
            rm -rf "$VECS"
            git clone --depth 1 https://github.com/SingleStepTests/65816.git "$VECS"
          fi
          echo "CPU65816_VECTORS=$VECS/v1" >> "$GITHUB_ENV"

      - name: Stage Blargg ROMs
        run: |
          set -eo pipefail
          ROMS="$HOME/snaggletooth-blargg-roms"
          if [ ! -f "$ROMS/.verified" ]; then
            rm -rf "$ROMS"; mkdir -p "$ROMS"
            curl -fsSL -o "$ROMS/blargg_testroms.zip" https://dl.qwertymodo.com/blargg_testroms.zip
            unzip -q -o "$ROMS/blargg_testroms.zip" -d "$ROMS"
            verify() {
              path="$(find "$ROMS" -type f -name "$1" -print -quit)"
              if [ -z "$path" ]; then echo "Blargg ROM $1 not found in the archive"; exit 1; fi
              if command -v sha256sum >/dev/null 2>&1; then
                got="$(sha256sum "$path" | cut -d' ' -f1)"
              else
                got="$(shasum -a 256 "$path" | cut -d' ' -f1)"
              fi
              if [ "$got" != "$2" ]; then echo "Blargg ROM $1 sha256 $got != $2"; exit 1; fi
            }
            verify spc_smp.sfc 2ed302c5b989675d4ab6b40001fd5166ac4c6e0188a6b1b6df878e4608999c03
            verify spc_timer.sfc f4799b994a91d78689073f4e31c3668ae46c100abd78177b9f4813506d6c9629
            verify spc_mem_access_times.sfc 53dc8005959d54ccfc95b8d4222e1d51d21e3d9f3491058320f105edc1a4454a
            verify spc_dsp6.sfc b12038f865536a33003c9887e6f86fcbcb526b7f1766526ab30cb74b7380aa9a
            touch "$ROMS/.verified"
          fi
          echo "BLARGG_ROMS=$ROMS" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSNAGGLETOOTH_SPC700_VECTORS="$SPC700_VECTORS" \
            -DSNAGGLETOOTH_65816_VECTORS="$CPU65816_VECTORS" \
            -DSNAGGLETOOTH_BLARGG_ROMS="$BLARGG_ROMS"

      - name: Build
        run: cmake --build "$GITHUB_WORKSPACE/build" --parallel

      - name: Stage build for manual testing
        run: rm -rf /tmp/snaggletooth-build && cp -R "$GITHUB_WORKSPACE/build" /tmp/snaggletooth-build

      - name: Test
        env:
          SNAGGLETOOTH_REQUIRE_VECTORS: '1'
          SNAGGLETOOTH_REQUIRE_65816_VECTORS: '1'
          SNAGGLETOOTH_REQUIRE_BLARGG_ROMS: '1'
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-output"
          ctest --test-dir "$GITHUB_WORKSPACE/build" --output-on-failure \
            2>&1 | tee "$GITHUB_WORKSPACE/ci-output/linux-x64-results.txt"

      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-results
          path: ci-output/

  # ── Windows x64 (WINDOWS-BVDA56O) ────────────────────────────────────────────
  windows-x64:
    name: Windows x64 (WINDOWS-BVDA56O)
    runs-on: [self-hosted, X64, Windows, windows_x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage SPC700 vectors
        shell: powershell
        run: |
          $VECS = "$($env:USERPROFILE -replace '\\','/')/snaggletooth-spc700-vectors"
          if (-not (Test-Path "$VECS/v1")) {
            if (Test-Path $VECS) { Remove-Item $VECS -Recurse -Force }
            git clone --depth 1 https://github.com/SingleStepTests/spc700.git $VECS
          }
          "SPC700_VECTORS=$VECS/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage 65816 vectors
        shell: powershell
        run: |
          $VECS = "$($env:USERPROFILE -replace '\\','/')/snaggletooth-65816-vectors"
          if (-not (Test-Path "$VECS/v1")) {
            if (Test-Path $VECS) { Remove-Item $VECS -Recurse -Force }
            git clone --depth 1 https://github.com/SingleStepTests/65816.git $VECS
          }
          "CPU65816_VECTORS=$VECS/v1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage Blargg ROMs
        shell: powershell
        run: |
          $ROMS = "$($env:USERPROFILE -replace '\\','/')/snaggletooth-blargg-roms"
          if (-not (Test-Path "$ROMS/.verified")) {
            if (Test-Path $ROMS) { Remove-Item $ROMS -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $ROMS | Out-Null
            Invoke-WebRequest -Uri https://dl.qwertymodo.com/blargg_testroms.zip -OutFile "$ROMS/blargg_testroms.zip"
            Expand-Archive -Path "$ROMS/blargg_testroms.zip" -DestinationPath $ROMS -Force
            $pins = [ordered]@{
              'spc_smp.sfc'              = '2ed302c5b989675d4ab6b40001fd5166ac4c6e0188a6b1b6df878e4608999c03'
              'spc_timer.sfc'            = 'f4799b994a91d78689073f4e31c3668ae46c100abd78177b9f4813506d6c9629'
              'spc_mem_access_times.sfc' = '53dc8005959d54ccfc95b8d4222e1d51d21e3d9f3491058320f105edc1a4454a'
              'spc_dsp6.sfc'             = 'b12038f865536a33003c9887e6f86fcbcb526b7f1766526ab30cb74b7380aa9a'
            }
            foreach ($name in $pins.Keys) {
              $file = Get-ChildItem -Path $ROMS -Recurse -Filter $name | Select-Object -First 1
              if (-not $file) { Write-Error "Blargg ROM $name not found in the archive"; exit 1 }
              $got = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash
              if ($got -ne $pins[$name].ToUpper()) { Write-Error "Blargg ROM $name sha256 $got != $($pins[$name])"; exit 1 }
            }
            New-Item -ItemType File -Path "$ROMS/.verified" -Force | Out-Null
          }
          "BLARGG_ROMS=$ROMS" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure
        shell: powershell
        run: |
          cmake -S $env:GITHUB_WORKSPACE -B C:\snaggletooth-ci-build `
            -G "Visual Studio 17 2022" -A x64 `
            -DSNAGGLETOOTH_SPC700_VECTORS="$env:SPC700_VECTORS" `
            -DSNAGGLETOOTH_65816_VECTORS="$env:CPU65816_VECTORS" `
            -DSNAGGLETOOTH_BLARGG_ROMS="$env:BLARGG_ROMS"

      - name: Build
        shell: powershell
        run: cmake --build C:\snaggletooth-ci-build --config Release --parallel

      - name: Test
        shell: powershell
        env:
          SNAGGLETOOTH_REQUIRE_VECTORS: '1'
          SNAGGLETOOTH_REQUIRE_65816_VECTORS: '1'
          SNAGGLETOOTH_REQUIRE_BLARGG_ROMS: '1'
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\ci-output" | Out-Null
          $results = "$env:GITHUB_WORKSPACE\ci-output\windows-x64-results.txt"
          cmd /c "ctest --test-dir C:\snaggletooth-ci-build -C Release --output-on-failure 2>&1" |
            Tee-Object -FilePath $results
          # Tee-Object does not update $LASTEXITCODE; propagate the ctest exit code
          # explicitly so a test failure fails the step instead of reporting green.
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-results
          path: ci-output/

  # ── macOS ARM64 (ericmacmini) ────────────────────────────────────────────────
  # The three ARM64 jobs share one physical host (the Mac and its linmac/winmac
