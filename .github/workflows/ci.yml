      - name: ccache stats
        run: ccache --show-stats
        continue-on-error: true

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-results
          path: ci-output/

  # ── Linux ARM64 (linmac-arm64 VM) ────────────────────────────────────────────
  linux-arm64:
    name: Linux ARM64 (linmac-arm64)
    runs-on: [self-hosted, Linux, ARM64, linmac-arm64]
