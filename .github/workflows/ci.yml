            }
            verify spc_smp.sfc 2ed302c5b989675d4ab6b40001fd5166ac4c6e0188a6b1b6df878e4608999c03
            verify spc_timer.sfc f4799b994a91d78689073f4e31c3668ae46c100abd78177b9f4813506d6c9629
